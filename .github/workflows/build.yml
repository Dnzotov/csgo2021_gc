name: Build

on:
  workflow_dispatch:

env:
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.9

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: '${{ github.workspace }}/vcpkg'
        doNotCache: true

    - name: Get vcpkg commit
      id: vcpkg-commit
      shell: bash
      run: echo "sha=$(git -C '${{ github.workspace }}/vcpkg' rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Cache vcpkg installed packages
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/build/vcpkg_installed
        key: vcpkg-${{ runner.os }}-${{ steps.vcpkg-commit.outputs.sha }}-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-${{ steps.vcpkg-commit.outputs.sha }}-

    # ---------- C++ ----------

    - name: Build Windows (C++)
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE/release" | Out-Null

        cmake -A Win32 -B "$env:GITHUB_WORKSPACE/build" -S "$env:GITHUB_WORKSPACE" `
          -DCMAKE_BUILD_TYPE=Release `
          -DOUTDIR="$env:GITHUB_WORKSPACE/release" `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET:STRING=x86-windows-static `
          -DCMAKE_C_COMPILER_LAUNCHER=sccache `
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

        cmake --build "$env:GITHUB_WORKSPACE/build" --config Release --target csgo srcds csgo_gc

    # ---------- Java backend ----------

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven

    - name: Build Java backend
      working-directory: java-backend
      shell: pwsh
      run: .\mvnw.cmd -B -DskipTests package

    # ---------- Package ----------

    - name: Package
      shell: pwsh
      run: |
        $release  = Join-Path $env:GITHUB_WORKSPACE 'release'
        $csgoGc   = Join-Path $release 'csgo_gc'
        $backend  = Join-Path $release 'backend'
        $srcBack  = Join-Path $env:GITHUB_WORKSPACE 'java-backend'

        # ---- sanity: C++ outputs ----
        if (!(Test-Path (Join-Path $release 'csgo.exe')))          { throw 'csgo.exe not found' }
        if (!(Test-Path (Join-Path $release 'srcds.exe')))         { throw 'srcds.exe not found' }
        if (!(Test-Path (Join-Path $csgoGc  'csgo_gc.dll')))       { throw 'csgo_gc/csgo_gc.dll not found' }

        # ---- csgo_gc/examples ----
        Copy-Item -Force "$env:GITHUB_WORKSPACE/examples/*" $csgoGc

        # ---- backend/ ----
        New-Item -ItemType Directory -Force -Path $backend              | Out-Null
        New-Item -ItemType Directory -Force -Path "$backend/target"     | Out-Null
        New-Item -ItemType Directory -Force -Path "$backend/config"     | Out-Null
        New-Item -ItemType Directory -Force -Path "$backend/.mvn/wrapper" | Out-Null

        Copy-Item -Force "$srcBack/target/matchmaking-backend.jar"    "$backend/target/matchmaking-backend.jar"
        Copy-Item -Force "$srcBack/run.cmd"                            $backend
        Copy-Item -Force "$srcBack/build.cmd"                          $backend
        Copy-Item -Force "$srcBack/mvnw"                               $backend
        Copy-Item -Force "$srcBack/mvnw.cmd"                           $backend
        Copy-Item -Force "$srcBack/README.md"                          $backend
        Copy-Item -Force "$srcBack/.mvn/wrapper/maven-wrapper.properties" "$backend/.mvn/wrapper/maven-wrapper.properties"
        Copy-Item -Force "$srcBack/config/application-example.properties" "$backend/config/application-example.properties"

        # ---- zip ----
        $zip = Join-Path $env:GITHUB_WORKSPACE 'csgo_gc_contineous_build.zip'
        if (Test-Path $zip) { Remove-Item $zip -Force }
        Compress-Archive -Path (Join-Path $release '*') -DestinationPath $zip -Force
        Get-ChildItem $zip

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: csgo_gc-contineous
        path: ${{ github.workspace }}/csgo_gc_contineous_build.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create/update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          TAG=contineous
          ZIP=$(find artifacts -type f -name "csgo_gc_contineous_build.zip" | head -n1)
          if [ -z "$ZIP" ]; then
            echo "zip artifact not found"
            exit 1
          fi

          gh release delete "$TAG" --repo "$REPO" --cleanup-tag --yes || true
          gh api --method DELETE "repos/$REPO/git/refs/tags/$TAG" || true

          sleep 5

          gh release create "$TAG" --repo "$REPO" \
            --title "Continuous Build" \
            --notes "$SHA" \
            --target "$SHA"

          gh release upload "$TAG" --repo "$REPO" "$ZIP" --clobber
