# Copy this file to  config/application.properties  (next to run.cmd) and fill in the credentials.
# config/application.properties is git-ignored: never commit real credentials.
# Every key can also be set with an environment variable, e.g. BACKEND_ADMIN_PASSWORD, SERVER_PORT.

# ---- HTTP -----------------------------------------------------------------------------------------------
# 127.0.0.1 = only this machine. Use 0.0.0.0 (or the LAN address) when the game / a browser on another PC must reach it.
server.address=192.168.1.150
server.port=8080

# ---- admin panel (REQUIRED, no defaults) ------------------------------------------------------------------
backend.admin.username=admin
backend.admin.password=2301

# ---- GC -> backend -----------------------------------------------------------------------------------
# Shared secret the csgo_gc.dll sends as the X-Api-Key header. Empty = the search/cancel endpoints are open.
backend.api-key=test-api

# ---- storage -------------------------------------------------------------------------------------------
backend.database-path=./data/matchmaking.db

# ---- searches ------------------------------------------------------------------------------------------
# a search that nobody refreshed or cancelled for this long is ended as "Timed out"
backend.stale-search-timeout=PT15M
# how often expired searches are swept
backend.reaper-interval=PT10S
# ended searches stay visible in the panel ("show ended") this long
backend.finished-search-retention=PT1H

# ---- login form lock-out -------------------------------------------------------------------------------
backend.login.max-failures=5
backend.login.failure-window=PT5M
backend.login.lock-duration=PT5M

# ---- session cookie -----------------------------------------------------------------------------------
server.servlet.session.timeout=30m
# true when the panel is served over HTTPS (reverse proxy), otherwise the browser would not send the cookie back
server.servlet.session.cookie.secure=false
