# Copy this file to  config/application.properties  (next to run.cmd) and fill in the credentials.
# config/application.properties is git-ignored: never commit real credentials.
# Every key can also be set with an environment variable, e.g. BACKEND_ADMIN_PASSWORD, SERVER_PORT.

# ---- HTTP -----------------------------------------------------------------------------------------------
# 127.0.0.1 = only this machine. Use 0.0.0.0 (or the LAN address) when the game / a browser on another PC must reach it.
server.address=127.0.0.1
server.port=8080

# ---- admin panel (REQUIRED, no defaults) ------------------------------------------------------------------
backend.admin.username=admin
backend.admin.password=CHANGE-ME-long-random-password

# ---- GC -> backend -----------------------------------------------------------------------------------
# Shared secret the csgo_gc.dll sends as the X-Api-Key header (its config.txt: matchmaking.backend_api_key).
# Empty = the GC-facing endpoints are open.
backend.api-key=CHANGE-ME-another-long-random-string

# ---- storage -------------------------------------------------------------------------------------------
backend.database-path=./data/matchmaking.db

# ---- searches ------------------------------------------------------------------------------------------
# The GC polls its search once a second, so a search nobody polled for this long (game crashed) is ended "Timed out"
backend.stale-search-timeout=PT15M
# how often expired searches / assignments / reservations are swept
backend.reaper-interval=PT10S
# ended searches stay visible in the panel ("show ended") this long
backend.finished-search-retention=PT1H

# ---- matchmaking (server selection) ------------------------------------------------------------------------
# how often the matcher looks for a free server / more players even when nothing new arrives
backend.matcher-interval=PT1S
# a server handed to a complete match stays RESERVED this long, then it is AVAILABLE again. There is no srcds heartbeat
# yet that says "the match is over" (POST /api/v1/servers/state exists, the srcds side does not call it), so this and the
# admin "Release" button are the ways a server comes back. Set it to about the length of a match.
backend.server-reservation-ttl=PT10M
# an assigned search (WAITING_ACCEPT / READY_TO_CONNECT) is completed after this long
backend.assigned-search-timeout=PT2M

# Real players a match of an Accept category needs (retail: competitive 10, wingman 4, dangerzone 16).
# TEST SETUP ONLY: while the missing participants are supplied by the srcds test roster (srcds started with -gc_mode,
# 1 real player + fakes), the backend must not wait for more real players:
# backend.required-players.competitive=1
# backend.required-players.wingman=1
# backend.required-players.dangerzone=1

# An Accept match on a game server that reads its roster from this backend (srcds -gc_mode, RESEARCH_FINDINGS.md #55) is
# handed to the players once that server confirmed it armed the roster; after this time they get the server anyway.
# backend.roster-ack-timeout=PT25S
# A server that asked for its roster this recently counts as "reads the roster from the backend".
# backend.roster-poll-window=PT10S

# TEST tool "Fake Players" of the admin panel (virtual players that fill a match a real player started).
# false = switched off (production): the API refuses fake searches and the matcher ignores them.
# backend.fake-players.enabled=true
# How long a gathering Accept match waits for more REAL players before its virtual players are decided, counted from the last real
# player (or party) that joined. Real players who press Play within this time of each other end up in ONE match; with 0 the first
# real player gets his match at once and the next one finds none (RESEARCH_FINDINGS.md #66). The number of virtual players is not
# a property: it is the Fake Players profile of the mode in the admin panel (count, maps, server, priority, ON/OFF - stored in the
# database, RESEARCH_FINDINGS.md #67). The panel also edits the master switch and this window (the panel's value wins).
# backend.fake-players.gather-window=PT10S

# ---- login form lock-out -------------------------------------------------------------------------------
backend.login.max-failures=5
backend.login.failure-window=PT5M
backend.login.lock-duration=PT5M

# ---- session cookie -----------------------------------------------------------------------------------
server.servlet.session.timeout=30m
# true when the panel is served over HTTPS (reverse proxy), otherwise the browser would not send the cookie back
server.servlet.session.cookie.secure=false
