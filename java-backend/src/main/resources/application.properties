# Defaults. Override in config/application.properties (next to the jar / working directory) or with environment
# variables (SERVER_PORT, SERVER_ADDRESS, BACKEND_ADMIN_USERNAME, BACKEND_ADMIN_PASSWORD, BACKEND_API_KEY,
# BACKEND_DATABASE_PATH, BACKEND_STALE_SEARCH_TIMEOUT ...). There are NO default credentials: the backend refuses to
# start until backend.admin.username / backend.admin.password are set.

spring.application.name=matchmaking-backend

# bind to loopback by default, use 0.0.0.0 (or a LAN address) only when the GC / a browser on another machine must reach it
server.address=127.0.0.1
server.port=8080

# SQLite file, the directory is created on start
backend.database-path=./data/matchmaking.db

# a search not refreshed for this long is expired (ISO-8601 duration or Spring format: 15m)
backend.stale-search-timeout=PT15M
backend.reaper-interval=PT10S
backend.finished-search-retention=PT1H

# backend.admin.username=
# backend.admin.password=
# backend.api-key=

# login form lock-out
backend.login.max-failures=5
backend.login.failure-window=PT5M
backend.login.lock-duration=PT5M

# session cookie: HttpOnly, SameSite=Lax; set secure=true when the panel is served over HTTPS
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=MMSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false

# snake_case JSON on the wire (account_id, game_type, ...)
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null

# the tables are created / migrated by SchemaInitializer (schema.sql) when the database is opened
spring.sql.init.mode=never

server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.problemdetails.enabled=false
logging.level.org.springframework.boot.autoconfigure.security=WARN
